name: Feature request
description: Suggest an idea or a new channel driver
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives you considered }
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options: [{ label: I'd like to open a PR for this }]
