name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Boot smoke test
        run: |
          SANDBOX_MODE=true PORT=3123 DATA_DIR=$RUNNER_TEMP/op node server.js &
          for i in $(seq 1 20); do curl -fs localhost:3123/api/health && break; sleep 0.5; done
          curl -fs localhost:3123/ | grep -q "Open Post"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t open-post:ci .
      - run: |
          docker run -d --name op -p 3000:3000 -e SANDBOX_MODE=true open-post:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && exit 0; sleep 1; done
          docker logs op; exit 1
  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci && npx next build
