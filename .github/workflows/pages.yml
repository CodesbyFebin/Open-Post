name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'llms.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: cp ../llms.txt public/llms.txt
      - run: npx next build
        env: { NEXT_PUBLIC_BASE_PATH: /Open-Post, NEXT_TELEMETRY_DISABLED: '1' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
