services:
  open-post:
    build: .
    image: open-post:local
    container_name: open-post
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
